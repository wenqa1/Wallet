# Codemagic 云端 iOS 构建流水线
#
# 前提：本机 Windows 无 Mac，iOS 的 .ipa 必须在云端 macOS 构建（与签名/越狱无关）。
#
# 两个工作流：
#   ios-release    → 有签名 + TestFlight（需要 Apple Developer 账号，$99/年）
#   ios-trollstore → 无签名 IPA（越狱 + 巨魔商店直装，免费，无需开发者账号）
#
# 用法：
#   1. 把仓库推到 Git 远端（GitHub/Gitee/GitLab，免费）
#   2. 在 codemagic.io 绑定仓库（免费额度足够）
#   3. 触发对应 workflow，下载构建产物

workflows:
  # ---------- 方案 A：越狱 + 巨魔商店（推荐，免费） ----------
  ios-trollstore:
    name: iOS TrollStore (unsigned IPA)
    max_build_duration: 45
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      # flutter build ipa --no-codesign 会跳过 IPA 生成（只出归档），
      # 所以用 flutter build ios 直接产出 Runner.app，再手动打包成 IPA。
      - name: Build unsigned Runner.app
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA for TrollStore
        script: |
          set -e
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --keepParent Payload Runner.ipa
          ls -lh Runner.ipa
    artifacts:
      - Runner.ipa
      - build/ios/iphoneos/Runner.app

  # ---------- 方案 B：App Store / TestFlight（需要 $99/年 开发者账号） ----------
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # 在 Codemagic UI 的 Environment variables 中配置：
      #   APP_STORE_CONNECT_KEY_IDENTIFIER / ISSUER_ID / PRIVATE_KEY = App Store Connect API Key
      vars:
        BUNDLE_ID: "com.kabao.kabao"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: release/*
          include: true
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(git rev-list --count HEAD)
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      # 如需构建结果邮件通知，取消注释并填入你的邮箱：
      # email:
      #   recipients:
      #     - you@example.com
      #   notify:
      #     success: true
      #     failure: true
